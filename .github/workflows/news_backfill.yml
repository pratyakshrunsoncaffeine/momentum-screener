name: News Catalysts - Historical Backfill

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing Supabase job ID (optional)
        required: false
        type: string
      as_of_date:
        description: Backfill end date in YYYY-MM-DD format
        required: false
        type: string
      partitions_per_run:
        description: Maximum daily GDELT partitions processed in this free Sandbox batch
        required: false
        default: "90"
        type: string

permissions:
  contents: read

concurrency:
  group: news-catalysts-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_NEWS_BUCKET: news-models
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      NEWS_BIGQUERY_SANDBOX: "true"
      NEWS_BIGQUERY_PARTITIONS_PER_RUN: ${{ inputs.partitions_per_run }}
      NEWS_BIGQUERY_MONTHLY_BUDGET_GIB: "900"
      NEWS_BIGQUERY_MAX_QUERY_GIB: "5"
      NEWS_BIGQUERY_MIN_SAMPLE_PCT: "1"
      NEWS_BIGQUERY_RESULT_ROW_LIMIT: "25000"
      NEWS_RSS_FEEDS_JSON: ${{ secrets.NEWS_RSS_FEEDS_JSON }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      - name: Install research worker dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt
      - name: Apply Supabase news schema
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: "5432"
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
          PGSSLMODE: require
        run: psql -v ON_ERROR_STOP=1 -f supabase/news_schema.sql
      - name: Resolve run date
        id: run_date
        shell: bash
        run: |
          RUN_DATE="${{ inputs.as_of_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Kolkata date +%F)"; fi
          echo "value=$RUN_DATE" >> "$GITHUB_OUTPUT"
      - name: Backfill news, prices, features, and models
        run: >-
          python -m screener_momentum.news_worker
          --job-type backfill
          --job-id "${{ inputs.job_id }}"
          --as-of-date "${{ steps.run_date.outputs.value }}"
