name: News Catalysts - Daily Forecast

on:
  schedule:
    - cron: "45 16 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      job_id:
        description: Existing Supabase job ID (optional)
        required: false
        type: string
      as_of_date:
        description: Signal date in YYYY-MM-DD format
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: news-catalysts-daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
      SUPABASE_NEWS_BUCKET: news-models
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      NEWS_RSS_FEEDS_JSON: ${{ secrets.NEWS_RSS_FEEDS_JSON }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON }}
      - name: Install research worker dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt
      - name: Resolve run date
        id: run_date
        shell: bash
        run: |
          RUN_DATE="${{ inputs.as_of_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Asia/Kolkata date +%F)"; fi
          echo "value=$RUN_DATE" >> "$GITHUB_OUTPUT"
      - name: Fetch new articles and publish forecasts
        run: >-
          python -m screener_momentum.news_worker
          --job-type daily
          --job-id "${{ inputs.job_id }}"
          --as-of-date "${{ steps.run_date.outputs.value }}"
