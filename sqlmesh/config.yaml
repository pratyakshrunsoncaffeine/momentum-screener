gateways:
  supabase:
    connection:
      type: postgres
      host: {{ env_var('SUPABASE_DB_HOST') }}
      port: 5432
      user: {{ env_var('SUPABASE_DB_USER') }}
      password: {{ env_var('SUPABASE_DB_PASSWORD') }}
      database: {{ env_var('SUPABASE_DB_NAME') }}
      sslmode: require

default_gateway: supabase

model_defaults:
  dialect: postgres
  start: 2021-01-01

